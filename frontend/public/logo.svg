<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <!-- Bus body -->
  <g fill="#ffd230">
    <!-- Speed lines -->
    <rect x="8" y="38" width="28" height="3" rx="1.5" opacity="0.7"/>
    <rect x="4" y="45" width="36" height="3" rx="1.5" opacity="0.8"/>
    <rect x="8" y="52" width="28" height="3" rx="1.5" opacity="0.7"/>
    <rect x="14" y="59" width="20" height="3" rx="1.5" opacity="0.5"/>

    <!-- Bus main body -->
    <rect x="44" y="28" width="188" height="52" rx="6"/>

    <!-- Roof bump -->
    <rect x="80" y="20" width="100" height="14" rx="5"/>

    <!-- Windows -->
    <rect x="90" y="34" width="20" height="14" rx="3" fill="#04383f"/>
    <rect x="116" y="34" width="20" height="14" rx="3" fill="#04383f"/>
    <rect x="142" y="34" width="20" height="14" rx="3" fill="#04383f"/>
    <rect x="168" y="34" width="20" height="14" rx="3" fill="#04383f"/>
    <rect x="194" y="34" width="18" height="14" rx="3" fill="#04383f"/>

    <!-- Front windshield -->
    <rect x="218" y="30" width="22" height="24" rx="4" fill="#04383f"/>

    <!-- Front bumper / detail -->
    <rect x="228" y="58" width="14" height="6" rx="2" fill="#04383f"/>

    <!-- Wheels -->
    <circle cx="88" cy="82" r="16"/>
    <circle cx="88" cy="82" r="8" fill="#04383f"/>
    <circle cx="176" cy="82" r="16"/>
    <circle cx="176" cy="82" r="8" fill="#04383f"/>

    <!-- Wheel arches -->
    <path d="M70 78 Q88 60 106 78" fill="#04383f" opacity="0.3"/>
    <path d="M158 78 Q176 60 194 78" fill="#04383f" opacity="0.3"/>
  </g>

  <!-- NÉOTRAVEL text -->
  <text x="44" y="112" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22" fill="#ffd230" letter-spacing="2">NÉOTRAVEL</text>

  <!-- bus script -->
  <text x="252" y="115" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#ffd230">bus</text>
</svg>
